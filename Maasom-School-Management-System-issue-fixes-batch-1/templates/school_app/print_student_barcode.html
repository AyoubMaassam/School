<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            text-align: center;
            margin: 20px;
        }
        .barcode-container {
            display: inline-block;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .student-name {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        @media print {
            body {
                margin: 0;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="barcode-container">
        <img src="data:image/png;base64,{{ barcode_image_base64 }}" alt="Barcode for {{ student.card_number }}">
        <div class="student-name">{{ student.first_name }} {{ student.last_name }}</div>
    </div>

    <div class="no-print" style="margin-top: 20px;">
        <button onclick="window.print();" class="btn btn-primary">طباعة</button>
        <a href="{% url 'student_detail' student.id %}" class="btn btn-secondary">العودة لملف الطالب</a>
    </div>

</body>
</html>
