<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة باركود الطالب</title>
    <style>
        @page {
            size: 58mm 40mm; /* Set page size for thermal printer */
            margin: 1mm; /* Minimal margin */
        }
        body {
            font-family: 'Tahoma', 'Helvetica', 'Arial', sans-serif;
            width: 56mm; /* Content width inside the 58mm paper */
            height: 38mm;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .barcode-container {
            width: 30mm; /* Set barcode width */
            margin-bottom: 2mm; /* Space between barcode and name */
        }
        .barcode-container img {
            max-width: 100%;
            height: auto;
        }
        .student-name {
            font-size: 9pt; /* Smaller font size for proportion */
            font-weight: bold;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body onload="window.print();">

    <div class="barcode-container">
        <img src="data:image/png;base64,{{ barcode_image_base64 }}" alt="Barcode">
    </div>
    <p class="student-name">{{ student.first_name }} {{ student.last_name }}</p>

</body>
</html>
